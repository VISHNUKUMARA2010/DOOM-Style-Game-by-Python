name: Build Windows release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pygame pyinstaller

      - name: Build game
        run: pyinstaller --clean --noconfirm DoomNightfall.spec

      - name: Create distributable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/DoomNightfall -DestinationPath DoomNightfall-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoomNightfall-windows
          path: DoomNightfall-windows.zip

      - name: Attach build to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: DoomNightfall-windows.zip